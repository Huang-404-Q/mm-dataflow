# Qwen2.5-VL-3B LoRA SFT -- the ONE config shared by all three groups.
#
# There is deliberately no a/b/c variant of this file. The A/B/C comparison is
# only valid if the three runs differ in exactly one thing, so the group is
# passed on the command line and everything else lives here, once:
#
#   llamafactory-cli train train/qwen2_5vl_lora_sft.yaml \
#       dataset=mmdf_b_cleaned output_dir=outputs/sft/b_cleaned
#
# Three copies of a YAML would let a stray edit desynchronise one run, and the
# resulting difference would be indistinguishable from a data-quality effect.
# scripts/run_experiment.sh drives all three.
#
# Sized for a single 24GB card (4090 / A10 / L20). See the memory notes below
# before changing per_device_train_batch_size or image_max_pixels.

### model
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
# The vision tower stays frozen. Two reasons, one practical and one
# experimental: it saves several GB of optimizer state and activations, and the
# noise we inject (blur, mismatch, duplicates, garbled text) is meant to be
# judged through the language model's grounding, not by re-teaching the ViT.
freeze_vision_tower: true

### dataset
# `dataset` is intentionally absent -- it is supplied per run. A default here
# would silently train the wrong group if an override were ever forgotten.
dataset_dir: data/sft
template: qwen2_vl
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 8
# Bounds the visual token count. Qwen2.5-VL uses dynamic resolution, so an
# unbounded COCO image can expand to well over a thousand tokens and blow the
# activation budget on samples that happen to be large. 512x512 keeps it
# predictable, which matters more here than peak accuracy: all three groups
# must hit the same memory ceiling or one of them will OOM and skew the run.
image_max_pixels: 262144
image_min_pixels: 3136

### output
output_dir: outputs/sft/unset      # overridden per run
logging_steps: 10
save_steps: 500
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
report_to: tensorboard

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8     # effective batch 16
learning_rate: 1.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
# Fixed seed across all three groups: run-to-run variance in LoRA SFT is not
# negligible, and an unseeded difference between B and C could easily be larger
# than the effect being measured.
seed: 42
